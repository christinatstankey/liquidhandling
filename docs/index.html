<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Handling — Reagent Database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    .controls {
      display: flex;
      gap: .75rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .search-input {
      flex: 1;
      min-width: 220px;
      max-width: 380px;
      padding: .45rem .75rem;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: .875rem;
      background: var(--surface);
      color: var(--text);
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .filter-select {
      padding: .45rem .7rem;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: .8rem;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      outline: none;
    }
    .filter-select:focus { border-color: var(--accent); }
    .results-count { font-size: .8rem; color: var(--muted); margin-left: auto; white-space: nowrap; }
    .rule-count {
      font-size: .68rem; font-weight: 600;
      padding: .15em .45em; border-radius: 3px;
      background: #F3F4F6; color: var(--muted);
      font-family: var(--font-mono);
    }
    .rule-count.has-rules { background: #ECFDF5; color: #065F46; }
    .no-results { grid-column: 1/-1; text-align: center; padding: 3rem 0; color: var(--muted); font-size: .9rem; }
    @media (max-width: 640px) {
    }
  </style>
</head>
<body>

<nav>
  <div class="container inner">
    <a class="wordmark" href="index.html">liquidhandling<span>.</span></a>
    <ul>
      <li><a href="index.html">Reagents</a></li>
      <li><a href="lists.html">Make a List</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </div>
</nav>

<main>
  <section class="grid-section container" style="padding-top:2rem">
    <div class="controls">
      <input id="search" class="search-input" type="search"
             placeholder="Search by reagent name or CAS" autocomplete="off" />
      <select id="filter-category" class="filter-select">
        <option value="">All categories</option>
      </select>
      <span id="results-count" class="results-count"></span>
    </div>
    <div id="reagent-grid" class="reagent-grid">
      <p class="loading" style="grid-column:1/-1;padding:2rem">Loading reagents…</p>
    </div>
  </section>
</main>

<footer>
  <div class="container">
    Data sourced from manufacturer SDS sheets and published bench protocols. Rules engine: transparent YAML — no ML.
  </div>
</footer>

<script>
const GHS_GLYPHS = {
  flame:             { glyph: '🔥', cls: 'pic-flame' },
  skull_crossbones:  { glyph: '☠',  cls: 'pic-skull_crossbones' },
  health_hazard:     { glyph: '⚠',  cls: 'pic-health_hazard' },
  corrosion:         { glyph: '⬡',  cls: 'pic-corrosion' },
  exclamation_mark:  { glyph: '!',   cls: 'pic-exclamation_mark' },
  environment:       { glyph: '🌿', cls: 'pic-environment' },
  oxidizer:          { glyph: '○',  cls: '' },
};

const CATEGORY_LABELS = {
  enzyme_glycerol:   'Enzyme / glycerol',
  volatile_solvent:  'Volatile solvent',
  viscous_reagent:   'Viscous reagent',
  detergent:         'Detergent',
  fluorophore:       'Fluorophore',
  light_sensitive:   'Light-sensitive',
  air_sensitive:     'Air-sensitive',
  reducing_agent:    'Reducing agent',
  fixative:          'Fixative',
  dmso:              'DMSO',
  adsorption_prone:  'Adsorption-prone',
  hygroscopic_solid: 'Hygroscopic solid',
  general_reagent:   'General reagent',
};

let allReagents = [];

const CATEGORY_ORDER = {
  volatile_solvent:  0,
  fixative:          1,
  reducing_agent:    2,
  fluorophore:       3,
  light_sensitive:   4,
  air_sensitive:     5,
  detergent:         6,
  viscous_reagent:   7,
  dmso:              8,
  hygroscopic_solid: 9,
  enzyme_glycerol:  10,
  general_reagent:  50,
  adsorption_prone: 99,
};

function normalizeName(s) {
  return String(s || '')
    .toLowerCase()
    .replace(/&/g, ' and ')
    .replace(/[^a-z0-9]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function commonAliases(r) {
  const aliases = [];
  const cas = String(r.cas || '');
  const name = normalizeName(r.name);
  if (cas === '67-68-5' || name.includes('dimethyl sulfoxide')) aliases.push('dmso');
  if (cas === '64-17-5' || name.includes('ethyl alcohol')) aliases.push('ethanol');
  return aliases;
}

function searchTokens(r) {
  return [
    String(r.name || '').toLowerCase(),
    normalizeName(r.name),
    String(r.cas || '').toLowerCase(),
    ...commonAliases(r),
  ].filter(Boolean);
}

function lineMatchesReagent(line, r) {
  const norm = normalizeName(r.name);
  const aliases = commonAliases(r);
  if (aliases.includes(line)) return true;
  if (line.includes(norm)) return true;
  if (line.length >= 5 && norm.split(' ').includes(line)) return true;
  return line.length >= 5 && norm.startsWith(`${line} `);
}

function ghsBadge(p) {
  if (!p) return '';
  const g = GHS_GLYPHS[p] || { glyph: '⬡', cls: '' };
  return `<span class="ghs-badge ${g.cls}" title="${p}">${g.glyph}</span>`;
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderCard(r) {
  const label = CATEGORY_LABELS[r.category] || (r.category ? r.category.replace(/_/g,' ') : '');
  const casDisplay = r.cas || 'Biologic';
  const href = `reagent.html?cas=${encodeURIComponent(r.file.replace('.json',''))}`;
  const rulesBadge = r.rules_fired_count > 0
    ? `<span class="rule-count has-rules">${r.rules_fired_count} rule${r.rules_fired_count !== 1 ? 's' : ''}</span>`
    : `<span class="rule-count">standard</span>`;

  return `
    <a class="reagent-card" href="${href}" data-category="${r.category || ''}"
       data-name="${esc((r.name||'').toLowerCase())}"
       data-search="${esc(searchTokens(r).join(' '))}"
       data-cas="${esc((r.cas||'').toLowerCase())}"
       data-signal="${r.signal_word||''}"
       data-rules="${r.rules_fired_count}">
      <div class="card-header">
        <div style="flex:1;min-width:0">
          <div class="card-name">${esc(r.name)}</div>
          <div class="card-cas">${esc(casDisplay)}</div>
        </div>
        ${ghsBadge(r.top_pictogram)}
      </div>
      <div style="display:flex;gap:.4rem;align-items:center;flex-wrap:wrap">
        ${label ? `<span class="card-category">${esc(label)}</span>` : ''}
        ${rulesBadge}
      </div>
      <p class="card-fact">${esc(r.summary_fact)}</p>
    </a>`;
}

function populateCategoryFilter(reagents) {
  const cats = [...new Set(reagents.map(r => r.category).filter(Boolean))]
    .sort((a, b) => (CATEGORY_ORDER[a] ?? 100) - (CATEGORY_ORDER[b] ?? 100) || a.localeCompare(b));
  const sel = document.getElementById('filter-category');
  cats.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = CATEGORY_LABELS[cat] || cat.replace(/_/g,' ');
    sel.appendChild(opt);
  });
}

function applyFilters() {
  const queryRaw = document.getElementById('search').value.trim().toLowerCase();
  const queryNorm = normalizeName(queryRaw);
  const category = document.getElementById('filter-category').value;

  let shown = 0;
  document.querySelectorAll('.reagent-card').forEach(card => {
    const match =
      (!queryRaw ||
        card.dataset.search.includes(queryRaw) ||
        (queryNorm && card.dataset.search.includes(queryNorm)) ||
        card.dataset.cas.includes(queryRaw)) &&
      (!category || card.dataset.category === category);
    card.style.display = match ? '' : 'none';
    if (match) shown++;
  });

  document.getElementById('results-count').textContent =
    shown === allReagents.length ? `${shown} reagents` : `${shown} of ${allReagents.length}`;

  const grid = document.getElementById('reagent-grid');
  const existing = grid.querySelector('.no-results');
  if (shown === 0 && !existing) {
    const d = document.createElement('div');
    d.className = 'no-results';
    d.textContent = 'No reagents match this filter.';
    grid.appendChild(d);
  } else if (shown > 0 && existing) {
    existing.remove();
  }
}

async function init() {
  const grid = document.getElementById('reagent-grid');
  try {
    const res = await fetch('data/manifest.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allReagents = await res.json();
    grid.innerHTML = allReagents.map(renderCard).join('');
    populateCategoryFilter(allReagents);
    document.getElementById('results-count').textContent = `${allReagents.length} reagents`;
    document.getElementById('search').addEventListener('input', applyFilters);
    document.getElementById('filter-category').addEventListener('change', applyFilters);
  } catch (err) {
    grid.innerHTML = `<p class="error" style="grid-column:1/-1">
      Could not load reagents: ${err.message}<br>
      Run <code>python3 scripts/build.py</code> then serve from <code>docs/</code>.
    </p>`;
  }
}

init();
</script>
</body>
</html>
